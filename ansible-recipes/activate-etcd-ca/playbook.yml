---
- name: Activate staged etcd CA files
  hosts: "{{ target_hosts | default('etcd_members') }}"
  become: true
  gather_facts: true
  serial: "{{ etcd_ca_rollout_serial | default(1) }}"
  vars:
    manifest_dir_effective: "{{ manifest_dir | default('/etc/kubernetes/manifests') }}"
    pki_dir_effective: "{{ pki_dir | default('/etc/kubernetes/pki') }}"
    etcd_pki_dir_effective: "{{ etcd_pki_dir | default('/etc/kubernetes/pki/etcd') }}"
    etcd_ca_active_cert_effective: "{{ etcd_ca_active_cert | default('ca.crt') }}"
    etcd_ca_active_key_effective: "{{ etcd_ca_active_key | default('ca.key') }}"
    etcd_ca_renewal_id_effective: "{{ etcd_ca_renewal_id | default(renewal_id | default(ansible_date_time.date | regex_replace('-', ''))) }}"
    etcd_ca_staged_cert_effective: "{{ etcd_ca_staged_cert | default('ca-new-' ~ etcd_ca_renewal_id_effective ~ '.crt') }}"
    etcd_ca_staged_key_effective: "{{ etcd_ca_staged_key | default('ca-new-' ~ etcd_ca_renewal_id_effective ~ '.key') }}"
    etcd_ca_backup_cert_effective: "{{ etcd_ca_backup_cert | default('ca-backup-' + ansible_date_time.iso8601_basic_short + '.crt') }}"
    etcd_ca_backup_key_effective: "{{ etcd_ca_backup_key | default('ca-backup-' + ansible_date_time.iso8601_basic_short + '.key') }}"
    etcd_ca_verify_cert_effective: "{{ etcd_ca_verify_cert | default(etcd_ca_active_cert_effective) }}"
    etcd_ca_active_cert_path_effective: "{{ etcd_ca_active_cert_path | default(etcd_pki_dir_effective + '/' + etcd_ca_active_cert_effective) }}"
    kube_apiserver_manifest_effective: "{{ kube_apiserver_manifest | default(manifest_dir_effective + '/kube-apiserver.yaml') }}"
    etcd_manifest_effective: "{{ etcd_manifest | default(manifest_dir_effective + '/etcd.yaml') }}"
    apiserver_etcd_certfile_effective: "{{ apiserver_etcd_certfile | default(pki_dir_effective + '/apiserver-etcd-client-new-' ~ etcd_ca_renewal_id_effective ~ '.crt') }}"
    apiserver_etcd_keyfile_effective: "{{ apiserver_etcd_keyfile | default(pki_dir_effective + '/apiserver-etcd-client-new-' ~ etcd_ca_renewal_id_effective ~ '.key') }}"
    etcd_certfile_effective: "{{ etcd_certfile | default(etcd_pki_dir_effective + '/server-new-' ~ etcd_ca_renewal_id_effective ~ '.crt') }}"
    etcd_keyfile_effective: "{{ etcd_keyfile | default(etcd_pki_dir_effective + '/server-new-' ~ etcd_ca_renewal_id_effective ~ '.key') }}"
    etcd_peer_certfile_effective: "{{ etcd_peer_certfile | default(etcd_pki_dir_effective + '/peer-new-' ~ etcd_ca_renewal_id_effective ~ '.crt') }}"
    etcd_peer_keyfile_effective: "{{ etcd_peer_keyfile | default(etcd_pki_dir_effective + '/peer-new-' ~ etcd_ca_renewal_id_effective ~ '.key') }}"
    require_staged_etcd_leaf_certs_effective: "{{ require_staged_etcd_leaf_certs | default(true) }}"
    manifest_backup_dir_effective: "{{ manifest_backup_dir | default('/etc/kubernetes/manifest-backups') }}"
    manifest_backup_suffix_effective: "{{ manifest_backup_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    restart_static_pods_effective: "{{ restart_static_pods | default(false) }}"
    etcd_ca_certificate_marker_effective: "{{ etcd_ca_certificate_marker | default('BEGIN CERTIFICATE') }}"
    file_move_command_effective: "{{ file_move_command | default('mv') }}"
    grep_command_effective: "{{ grep_command | default('grep') }}"
    openssl_command_effective: "{{ openssl_command | default('openssl') }}"
    etcd_ca_file_pairs:
      - label: certificate
        active: "{{ etcd_ca_active_cert_effective }}"
        staged: "{{ etcd_ca_staged_cert_effective }}"
        backup: "{{ etcd_ca_backup_cert_effective }}"
      - label: private key
        active: "{{ etcd_ca_active_key_effective }}"
        staged: "{{ etcd_ca_staged_key_effective }}"
        backup: "{{ etcd_ca_backup_key_effective }}"
    etcd_ca_required_files: "{{ etcd_ca_file_pairs | map(attribute='active') | list + etcd_ca_file_pairs | map(attribute='staged') | list }}"
    etcd_ca_all_filenames: "{{ etcd_ca_required_files + (etcd_ca_file_pairs | map(attribute='backup') | list) }}"
  tasks:
    - name: Validate etcd CA activation parameters
      ansible.builtin.assert:
        that:
          - manifest_dir_effective | length > 0
          - pki_dir_effective | length > 0
          - etcd_pki_dir_effective | length > 0
          - etcd_ca_active_cert_effective | length > 0
          - etcd_ca_active_key_effective | length > 0
          - etcd_ca_staged_cert_effective | length > 0
          - etcd_ca_staged_key_effective | length > 0
          - etcd_ca_backup_cert_effective | length > 0
          - etcd_ca_backup_key_effective | length > 0
          - etcd_ca_verify_cert_effective | length > 0
          - etcd_ca_active_cert_path_effective | length > 0
          - kube_apiserver_manifest_effective | length > 0
          - etcd_manifest_effective | length > 0
          - apiserver_etcd_certfile_effective | length > 0
          - apiserver_etcd_keyfile_effective | length > 0
          - etcd_certfile_effective | length > 0
          - etcd_keyfile_effective | length > 0
          - etcd_peer_certfile_effective | length > 0
          - etcd_peer_keyfile_effective | length > 0
          - manifest_backup_dir_effective | length > 0
          - manifest_backup_suffix_effective | length > 0
          - etcd_ca_all_filenames | unique | length == etcd_ca_all_filenames | length
        fail_msg: Set non-empty, distinct active, staged, backup, manifest, and etcd CA paths.

    - name: Check required etcd CA files
      ansible.builtin.stat:
        path: "{{ etcd_pki_dir_effective }}/{{ item }}"
      loop: "{{ etcd_ca_required_files }}"
      register: required_etcd_ca_files

    - name: Fail when a required etcd CA file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required etcd CA file is missing or not a regular file: {{ item.item }}"
      loop: "{{ required_etcd_ca_files.results }}"

    - name: Check kube-apiserver and etcd manifests
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - name: kube-apiserver
          path: "{{ kube_apiserver_manifest_effective }}"
        - name: etcd
          path: "{{ etcd_manifest_effective }}"
      register: static_pod_manifests
      loop_control:
        label: "{{ item.name }}"

    - name: Fail when a required static pod manifest is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required static pod manifest is missing or not a regular file: {{ item.item.path }}"
      loop: "{{ static_pod_manifests.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Validate kube-apiserver etcd CA insertion point
      ansible.builtin.command:
        argv:
          - awk
          - |
            /^[[:space:]]*-[[:space:]]*--etcd-cafile=/ { found = 1 }
            /^[[:space:]]*-[[:space:]]*--etcd-servers=/ { found = 1 }
            END { exit found ? 0 : 1 }
          - "{{ kube_apiserver_manifest_effective }}"
      changed_when: false

    - name: Validate etcd client trusted CA insertion point
      ansible.builtin.command:
        argv:
          - awk
          - |
            /^[[:space:]]*-[[:space:]]*--trusted-ca-file=/ { found = 1 }
            /^[[:space:]]*-[[:space:]]*--client-cert-auth=/ { found = 1 }
            END { exit found ? 0 : 1 }
          - "{{ etcd_manifest_effective }}"
      changed_when: false

    - name: Validate etcd peer trusted CA insertion point
      ansible.builtin.command:
        argv:
          - awk
          - |
            /^[[:space:]]*-[[:space:]]*--peer-trusted-ca-file=/ { found = 1 }
            /^[[:space:]]*-[[:space:]]*--peer-client-cert-auth=/ { found = 1 }
            END { exit found ? 0 : 1 }
          - "{{ etcd_manifest_effective }}"
      changed_when: false

    - name: Verify manifests already use staged etcd leaf certificates
      ansible.builtin.command:
        argv:
          - awk
          - "-v"
          - "apiserver_cert={{ apiserver_etcd_certfile_effective }}"
          - "-v"
          - "apiserver_key={{ apiserver_etcd_keyfile_effective }}"
          - "-v"
          - "etcd_cert={{ etcd_certfile_effective }}"
          - "-v"
          - "etcd_key={{ etcd_keyfile_effective }}"
          - "-v"
          - "peer_cert={{ etcd_peer_certfile_effective }}"
          - "-v"
          - "peer_key={{ etcd_peer_keyfile_effective }}"
          - |
            function count_arg(file, arg, expected, line, count) {
              count = 0
              while ((getline line < file) > 0) {
                if (line ~ "^[[:space:]]*-[[:space:]]*" arg "=") {
                  count++
                  sub("^[[:space:]]*-[[:space:]]*" arg "=", "", line)
                  sub("[[:space:]]*$", "", line)
                  if (line != expected) {
                    print file ": " arg " does not match " expected > "/dev/stderr"
                    close(file)
                    return 1
                  }
                }
              }
              close(file)
              if (count != 1) {
                print file ": expected one " arg " entry, found " count > "/dev/stderr"
                return 1
              }
              return 0
            }
            BEGIN {
              failed = 0
              failed += count_arg(ARGV[1], "--etcd-certfile", apiserver_cert)
              failed += count_arg(ARGV[1], "--etcd-keyfile", apiserver_key)
              failed += count_arg(ARGV[2], "--cert-file", etcd_cert)
              failed += count_arg(ARGV[2], "--key-file", etcd_key)
              failed += count_arg(ARGV[2], "--peer-cert-file", peer_cert)
              failed += count_arg(ARGV[2], "--peer-key-file", peer_key)
              exit failed
            }
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ etcd_manifest_effective }}"
      changed_when: false
      when: require_staged_etcd_leaf_certs_effective | bool

    - name: Create manifest backup directory
      ansible.builtin.file:
        path: "{{ manifest_backup_dir_effective }}"
        state: directory
        mode: "0700"

    - name: Back up kube-apiserver manifest
      ansible.builtin.copy:
        src: "{{ kube_apiserver_manifest_effective }}"
        dest: "{{ manifest_backup_dir_effective }}/kube-apiserver.yaml.{{ manifest_backup_suffix_effective }}"
        remote_src: true
        mode: preserve

    - name: Back up etcd manifest
      ansible.builtin.copy:
        src: "{{ etcd_manifest_effective }}"
        dest: "{{ manifest_backup_dir_effective }}/etcd.yaml.{{ manifest_backup_suffix_effective }}"
        remote_src: true
        mode: preserve

    - name: Move active etcd CA files aside
      ansible.builtin.command:
        argv:
          - "{{ file_move_command_effective }}"
          - "{{ item.active }}"
          - "{{ item.backup }}"
      args:
        chdir: "{{ etcd_pki_dir_effective }}"
      loop: "{{ etcd_ca_file_pairs }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Promote staged etcd CA files
      ansible.builtin.command:
        argv:
          - "{{ file_move_command_effective }}"
          - "{{ item.staged }}"
          - "{{ item.active }}"
      args:
        chdir: "{{ etcd_pki_dir_effective }}"
      loop: "{{ etcd_ca_file_pairs }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Configure kube-apiserver active etcd CA
      ansible.builtin.lineinfile:
        path: "{{ kube_apiserver_manifest_effective }}"
        regexp: '^\s*-\s*--etcd-cafile='
        line: "    - --etcd-cafile={{ etcd_ca_active_cert_path_effective }}"
        insertafter: '^\s*-\s*--etcd-servers='
        firstmatch: true

    - name: Configure etcd client trusted CA
      ansible.builtin.lineinfile:
        path: "{{ etcd_manifest_effective }}"
        regexp: '^\s*-\s*--trusted-ca-file='
        line: "    - --trusted-ca-file={{ etcd_ca_active_cert_path_effective }}"
        insertafter: '^\s*-\s*--client-cert-auth='
        firstmatch: true

    - name: Configure etcd peer trusted CA
      ansible.builtin.lineinfile:
        path: "{{ etcd_manifest_effective }}"
        regexp: '^\s*-\s*--peer-trusted-ca-file='
        line: "    - --peer-trusted-ca-file={{ etcd_ca_active_cert_path_effective }}"
        insertafter: '^\s*-\s*--peer-client-cert-auth='
        firstmatch: true

    - name: Count certificates in active etcd CA certificate
      ansible.builtin.command:
        argv:
          - "{{ grep_command_effective }}"
          - "-c"
          - "{{ etcd_ca_certificate_marker_effective }}"
          - "{{ etcd_ca_verify_cert_effective }}"
      args:
        chdir: "{{ etcd_pki_dir_effective }}"
      register: etcd_ca_certificate_count
      changed_when: false

    - name: Verify active etcd CA certificate details
      ansible.builtin.command:
        argv:
          - "{{ openssl_command_effective }}"
          - x509
          - "-in"
          - "{{ etcd_ca_verify_cert_effective }}"
          - "-noout"
          - "-subject"
          - "-issuer"
          - "-dates"
          - "-fingerprint"
          - "-sha256"
      args:
        chdir: "{{ etcd_pki_dir_effective }}"
      register: etcd_ca_certificate_details
      changed_when: false

    - name: Verify configured static pod manifest arguments
      ansible.builtin.command:
        argv:
          - awk
          - "-v"
          - "active_ca={{ etcd_ca_active_cert_path_effective }}"
          - |
            function count_arg(file, arg, expected, line, count) {
              count = 0
              while ((getline line < file) > 0) {
                if (line ~ "^[[:space:]]*-[[:space:]]*" arg "=") {
                  count++
                  sub("^[[:space:]]*-[[:space:]]*" arg "=", "", line)
                  sub("[[:space:]]*$", "", line)
                  if (line != expected) {
                    print file ": " arg " does not match " expected > "/dev/stderr"
                    close(file)
                    return 1
                  }
                }
              }
              close(file)
              if (count != 1) {
                print file ": expected one " arg " entry, found " count > "/dev/stderr"
                return 1
              }
              return 0
            }
            BEGIN {
              failed = 0
              failed += count_arg(ARGV[1], "--etcd-cafile", active_ca)
              failed += count_arg(ARGV[2], "--trusted-ca-file", active_ca)
              failed += count_arg(ARGV[2], "--peer-trusted-ca-file", active_ca)
              exit failed
            }
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ etcd_manifest_effective }}"
      changed_when: false

    - name: Trigger kube-apiserver static pod restart
      ansible.builtin.file:
        path: "{{ kube_apiserver_manifest_effective }}"
        state: touch
      when: restart_static_pods_effective | bool

    - name: Trigger etcd static pod restart
      ansible.builtin.file:
        path: "{{ etcd_manifest_effective }}"
        state: touch
      when: restart_static_pods_effective | bool

    - name: Print active etcd CA certificate verification
      ansible.builtin.debug:
        msg: "{{ etcd_ca_certificate_count.stdout_lines + etcd_ca_certificate_details.stdout_lines }}"
