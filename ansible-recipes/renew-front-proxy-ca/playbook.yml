---
- name: Generate front-proxy CA replacement and trust bundle
  hosts: "{{ target_hosts | default('masters') }}"
  become: true
  gather_facts: false
  vars:
    front_proxy_ca_source_host_effective: "{{ front_proxy_ca_source_host | default('master0') }}"
    pki_dir_effective: "{{ pki_dir | default('/etc/kubernetes/pki') }}"
    front_proxy_ca_current_cert_effective: "{{ front_proxy_ca_current_cert | default('front-proxy-ca.crt') }}"
    front_proxy_ca_new_key_effective: "{{ front_proxy_ca_new_key | default('front-proxy-ca-new.key') }}"
    front_proxy_ca_new_cert_effective: "{{ front_proxy_ca_new_cert | default('front-proxy-ca-new.crt') }}"
    front_proxy_ca_bundle_effective: "{{ front_proxy_ca_bundle | default('front-proxy-ca-bundle.crt') }}"
    front_proxy_ca_key_bits_effective: "{{ front_proxy_ca_key_bits | default(4096) }}"
    front_proxy_ca_valid_days_effective: "{{ front_proxy_ca_valid_days | default(3650) }}"
    front_proxy_ca_subject_effective: "{{ front_proxy_ca_subject | default('/CN=kubernetes-front-proxy-ca') }}"
    front_proxy_ca_digest_effective: "{{ front_proxy_ca_digest | default('sha256') }}"
    front_proxy_ca_basic_constraints_effective: "{{ front_proxy_ca_basic_constraints | default('basicConstraints=critical,CA:TRUE') }}"
    front_proxy_ca_key_usage_effective: "{{ front_proxy_ca_key_usage | default('keyUsage=critical,keyCertSign,cRLSign') }}"
    front_proxy_ca_new_key_mode_effective: "{{ front_proxy_ca_new_key_mode | default('0600') }}"
    front_proxy_ca_new_cert_mode_effective: "{{ front_proxy_ca_new_cert_mode | default('0644') }}"
    front_proxy_ca_bundle_mode_effective: "{{ front_proxy_ca_bundle_mode | default('0644') }}"
    front_proxy_ca_certificate_marker_effective: "{{ front_proxy_ca_certificate_marker | default('BEGIN CERTIFICATE') }}"
    openssl_command_effective: "{{ openssl_command | default('openssl') }}"
    grep_command_effective: "{{ grep_command | default('grep') }}"
    cat_command_effective: "{{ cat_command | default('cat') }}"
    shell_executable_effective: "{{ shell_executable | default('/bin/bash') }}"
    front_proxy_ca_generated_files:
      - path: "{{ front_proxy_ca_new_key_effective }}"
        mode: "{{ front_proxy_ca_new_key_mode_effective }}"
      - path: "{{ front_proxy_ca_new_cert_effective }}"
        mode: "{{ front_proxy_ca_new_cert_mode_effective }}"
      - path: "{{ front_proxy_ca_bundle_effective }}"
        mode: "{{ front_proxy_ca_bundle_mode_effective }}"
    front_proxy_ca_managed_filenames:
      - "{{ front_proxy_ca_current_cert_effective }}"
      - "{{ front_proxy_ca_new_key_effective }}"
      - "{{ front_proxy_ca_new_cert_effective }}"
      - "{{ front_proxy_ca_bundle_effective }}"
  tasks:
    - name: Validate front-proxy CA generation parameters
      ansible.builtin.assert:
        that:
          - pki_dir_effective | length > 0
          - front_proxy_ca_current_cert_effective | length > 0
          - front_proxy_ca_new_key_effective | length > 0
          - front_proxy_ca_new_cert_effective | length > 0
          - front_proxy_ca_bundle_effective | length > 0
          - front_proxy_ca_key_bits_effective | int > 0
          - front_proxy_ca_valid_days_effective | int > 0
          - front_proxy_ca_subject_effective | length > 0
          - front_proxy_ca_digest_effective | length > 0
          - front_proxy_ca_source_host_effective in ansible_play_hosts_all
          - front_proxy_ca_managed_filenames | unique | length == front_proxy_ca_managed_filenames | length
        fail_msg: Set non-empty, distinct front-proxy CA file names and positive certificate settings.

    - name: Check current front-proxy CA certificate
      ansible.builtin.stat:
        path: "{{ pki_dir_effective }}/{{ front_proxy_ca_current_cert_effective }}"
      register: current_front_proxy_ca_cert

    - name: Fail when current front-proxy CA certificate is missing
      ansible.builtin.assert:
        that:
          - current_front_proxy_ca_cert.stat.exists
          - current_front_proxy_ca_cert.stat.isreg
        fail_msg: "Current front-proxy CA certificate is missing or not a regular file: {{ pki_dir_effective }}/{{ front_proxy_ca_current_cert_effective }}"

    - name: Record current front-proxy CA certificate checksum
      ansible.builtin.set_fact:
        current_front_proxy_ca_cert_checksum: "{{ current_front_proxy_ca_cert.stat.checksum }}"

    - name: Verify current front-proxy CA certificates match across target hosts
      ansible.builtin.assert:
        that:
          - current_front_proxy_ca_cert_checksums | unique | length == 1
        fail_msg: All target hosts must start with the same active front-proxy CA certificate.
      vars:
        current_front_proxy_ca_cert_checksums: "{{ ansible_play_hosts_all | map('extract', hostvars, 'current_front_proxy_ca_cert_checksum') | list }}"
      run_once: true

    - name: Generate new front-proxy CA private key
      ansible.builtin.command:
        argv:
          - "{{ openssl_command_effective }}"
          - genrsa
          - "-out"
          - "{{ front_proxy_ca_new_key_effective }}"
          - "{{ front_proxy_ca_key_bits_effective | string }}"
      args:
        chdir: "{{ pki_dir_effective }}"
        creates: "{{ pki_dir_effective }}/{{ front_proxy_ca_new_key_effective }}"
      delegate_to: "{{ front_proxy_ca_source_host_effective }}"
      run_once: true

    - name: Generate new front-proxy CA certificate
      ansible.builtin.command:
        argv:
          - "{{ openssl_command_effective }}"
          - req
          - "-x509"
          - "-new"
          - "-nodes"
          - "-key"
          - "{{ front_proxy_ca_new_key_effective }}"
          - "-{{ front_proxy_ca_digest_effective }}"
          - "-days"
          - "{{ front_proxy_ca_valid_days_effective | string }}"
          - "-subj"
          - "{{ front_proxy_ca_subject_effective }}"
          - "-addext"
          - "{{ front_proxy_ca_basic_constraints_effective }}"
          - "-addext"
          - "{{ front_proxy_ca_key_usage_effective }}"
          - "-out"
          - "{{ front_proxy_ca_new_cert_effective }}"
      args:
        chdir: "{{ pki_dir_effective }}"
        creates: "{{ pki_dir_effective }}/{{ front_proxy_ca_new_cert_effective }}"
      delegate_to: "{{ front_proxy_ca_source_host_effective }}"
      run_once: true

    - name: Build old plus new front-proxy CA bundle
      ansible.builtin.shell: >-
        "{{ cat_command_effective }}"
        "{{ front_proxy_ca_current_cert_effective }}"
        "{{ front_proxy_ca_new_cert_effective }}"
        > "{{ front_proxy_ca_bundle_effective }}"
      args:
        chdir: "{{ pki_dir_effective }}"
        executable: "{{ shell_executable_effective }}"
      delegate_to: "{{ front_proxy_ca_source_host_effective }}"
      run_once: true

    - name: Set source front-proxy CA file permissions
      ansible.builtin.file:
        path: "{{ pki_dir_effective }}/{{ item.path }}"
        mode: "{{ item.mode }}"
      loop: "{{ front_proxy_ca_generated_files }}"
      delegate_to: "{{ front_proxy_ca_source_host_effective }}"
      run_once: true

    - name: Read generated front-proxy CA files from source host
      ansible.builtin.slurp:
        src: "{{ pki_dir_effective }}/{{ item.path }}"
      loop: "{{ front_proxy_ca_generated_files }}"
      register: generated_front_proxy_ca_files
      delegate_to: "{{ front_proxy_ca_source_host_effective }}"
      run_once: true
      no_log: true

    - name: Install generated front-proxy CA files on target hosts
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ pki_dir_effective }}/{{ item.item.path }}"
        mode: "{{ item.item.mode }}"
      loop: "{{ generated_front_proxy_ca_files.results }}"
      no_log: true

    - name: Count certificates in front-proxy CA bundle
      ansible.builtin.command:
        argv:
          - "{{ grep_command_effective }}"
          - "-c"
          - "{{ front_proxy_ca_certificate_marker_effective }}"
          - "{{ front_proxy_ca_bundle_effective }}"
      args:
        chdir: "{{ pki_dir_effective }}"
      register: front_proxy_ca_bundle_count
      changed_when: false

    - name: Verify new front-proxy CA certificate
      ansible.builtin.command:
        argv:
          - "{{ openssl_command_effective }}"
          - x509
          - "-in"
          - "{{ front_proxy_ca_new_cert_effective }}"
          - "-noout"
          - "-subject"
          - "-issuer"
          - "-dates"
          - "-fingerprint"
          - "-sha256"
      args:
        chdir: "{{ pki_dir_effective }}"
      register: front_proxy_ca_certificate_details
      changed_when: false

    - name: Print verification result
      ansible.builtin.debug:
        msg: "{{ front_proxy_ca_bundle_count.stdout_lines + front_proxy_ca_certificate_details.stdout_lines }}"
