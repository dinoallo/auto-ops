      - label: API server etcd client private key
        src: "{{ pki_dir_effective }}/apiserver-etcd-client-new-{{ renewal_id_effective }}.key"
        dest: "{{ pki_dir_effective }}/apiserver-etcd-client.key"
      - label: etcd healthcheck client certificate
