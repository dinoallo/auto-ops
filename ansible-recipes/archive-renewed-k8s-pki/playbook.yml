        - promote_etcd_effective | bool
        - item.0.stat.exists
        - not item.1.stat.exists or item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Remove duplicate renewed etcd PKI source files
      ansible.builtin.file:
        path: "{{ item.0.item.src }}"
        state: absent
      loop: "{{ etcd_source_files.results | default([]) | zip(etcd_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_etcd_effective | bool
        - remove_duplicate_sources_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') == item.1.stat.checksum | default('')

    - name: Verify promoted etcd PKI files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ etcd_pki_promotions_effective }}"
      register: promoted_etcd_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_etcd_effective | bool

    - name: Fail when a promoted etcd PKI destination is missing
      ansible.builtin.assert:
        that:
          - item.1.stat.exists
          - item.1.stat.isreg
        fail_msg: "Promoted etcd PKI destination is missing or not regular: {{ item.0.item.dest }}"
      loop: "{{ etcd_source_files.results | default([]) | zip(promoted_etcd_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_etcd_effective | bool
        - item.0.stat.exists or item.0.item.require_active | default(true) | bool

    - name: Check etcd static pod manifests
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - label: kube-apiserver manifest
          path: "{{ kube_apiserver_manifest_effective }}"
        - label: etcd manifest
          path: "{{ etcd_manifest_effective }}"
      register: etcd_manifest_files
      loop_control:
        label: "{{ item.label }}"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Fail when an etcd static pod manifest is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required etcd static pod manifest is missing or not regular: {{ item.item.path }}"
      loop: "{{ etcd_manifest_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label }}"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Create etcd manifest backup directory
      ansible.builtin.file:
        path: "{{ manifest_backup_dir_effective }}"
        state: directory
        mode: "0700"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Back up etcd static pod manifests
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ manifest_backup_dir_effective }}/{{ item.path | basename }}.etcd-archive-{{ renewal_id_effective }}.{{ manifest_backup_suffix_effective }}"
        remote_src: true
        mode: preserve
      loop:
        - "{{ {'path': kube_apiserver_manifest_effective} }}"
        - "{{ {'path': etcd_manifest_effective} }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Configure kube-apiserver canonical etcd PKI paths
      ansible.builtin.lineinfile:
        path: "{{ kube_apiserver_manifest_effective }}"
        regexp: '^\s*-\s*{{ item.key | regex_escape }}='
        line: "    - {{ item.key }}={{ item.value }}"
        insertafter: "{{ item.anchor }}"
        firstmatch: true
      loop: "{{ etcd_apiserver_manifest_arguments }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Configure etcd canonical PKI paths
      ansible.builtin.lineinfile:
        path: "{{ etcd_manifest_effective }}"
        regexp: '^\s*-\s*{{ item.key | regex_escape }}='
        line: "    - {{ item.key }}={{ item.value }}"
        insertafter: "{{ item.anchor }}"
        firstmatch: true
      loop: "{{ etcd_manifest_arguments }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Verify canonical etcd manifest arguments
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import sys

            def read_command(path):
                command = []
                for line in pathlib.Path(path).read_text().splitlines():
                    stripped = line.strip()
                    if stripped.startswith("- --") and "=" in stripped:
                        command.append(stripped[2:])
                return command

            failed = False
            for path, expected_json in ((sys.argv[1], sys.argv[3]), (sys.argv[2], sys.argv[4])):
                command = read_command(path)
                expected = json.loads(expected_json)
                for item in expected:
                    expected_arg = f"{item['key']}={item['value']}"
                    if command.count(expected_arg) != 1:
                        print(f"{path}: expected one {expected_arg}", file=sys.stderr)
                        failed = True
                for key in {item["key"] for item in expected}:
                    expected_count = sum(1 for item in expected if item["key"] == key)
                    actual_count = sum(1 for arg in command if arg.startswith(key + "="))
                    if actual_count != expected_count:
                        print(f"{path}: expected {expected_count} {key} entries, found {actual_count}", file=sys.stderr)
                        failed = True
            if failed:
                raise SystemExit(1)
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ etcd_manifest_effective }}"
          - "{{ etcd_apiserver_manifest_arguments | to_json }}"
          - "{{ etcd_manifest_arguments | to_json }}"
      changed_when: false
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Trigger etcd static pod restarts
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
      loop:
        - "{{ etcd_manifest_effective }}"
        - "{{ kube_apiserver_manifest_effective }}"
      when:
        - promote_etcd_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_static_pods_effective | bool
