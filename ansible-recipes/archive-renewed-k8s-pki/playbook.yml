        dest: "{{ etcd_pki_dir_effective }}/peer.key"
      - label: etcd server certificate
        src: "{{ etcd_pki_dir_effective }}/server-new-{{ renewal_id_effective }}.crt"
        dest: "{{ etcd_pki_dir_effective }}/server.crt"
      - label: etcd server private key
        src: "{{ etcd_pki_dir_effective }}/server-new-{{ renewal_id_effective }}.key"
        dest: "{{ etcd_pki_dir_effective }}/server.key"
