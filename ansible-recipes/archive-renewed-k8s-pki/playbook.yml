        dest: "{{ etcd_pki_dir_effective }}/healthcheck-client.key"
      - label: etcd peer certificate
        src: "{{ etcd_pki_dir_effective }}/peer-new-{{ renewal_id_effective }}.crt"
        dest: "{{ etcd_pki_dir_effective }}/peer.crt"
      - label: etcd peer private key
