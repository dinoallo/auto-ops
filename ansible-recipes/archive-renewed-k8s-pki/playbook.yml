---
- name: Validate PKI archive and promotion scope
  hosts: localhost
  gather_facts: false
  vars:
    promotion_scope_effective: "{{ promotion_scope | default('all') }}"
  tasks:
    - name: Validate promotion scope
      ansible.builtin.assert:
        that:
          - promotion_scope_effective in ['all', 'root', 'front-proxy', 'etcd']
        fail_msg: Set promotion_scope to one of all, root, front-proxy, or etcd.

- name: Archive active root PKI files and promote renewed files
  hosts: "{{ root_target_hosts | default(target_hosts | default('masters')) }}"
  become: true
  gather_facts: true
  serial: "{{ archive_promote_serial | default(1) }}"
  vars:
    promotion_scope_effective: "{{ promotion_scope | default('all') }}"
    promote_root_effective: "{{ promote_root | default(promotion_scope_effective in ['all', 'root']) }}"
    pki_dir_effective: "{{ pki_dir | default('/etc/kubernetes/pki') }}"
    kube_dir_effective: "{{ kube_dir | default('/etc/kubernetes') }}"
    renewal_id_effective: "{{ k8s_ca_renewal_id | default(renewal_id | default((ansible_date_time.date | regex_replace('-', '')) ~ ansible_date_time.hour)) }}"
    archive_dir_effective: "{{ root_archive_dir | default(pki_dir_effective + '/archive/root-' + renewal_id_effective) }}"
    archive_suffix_effective: "{{ archive_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    require_active_files_effective: "{{ require_active_files | default(true) }}"
    require_renewed_sources_effective: "{{ require_renewed_sources | default(true) }}"
    remove_duplicate_sources_effective: "{{ remove_duplicate_sources | default(true) }}"
    canonicalize_manifests_effective: "{{ canonicalize_manifests | default(true) }}"
    restart_static_pods_effective: "{{ restart_static_pods | default(false) }}"
    file_move_command_effective: "{{ file_move_command | default('mv') }}"
    manifest_dir_effective: "{{ manifest_dir | default('/etc/kubernetes/manifests') }}"
    manifest_backup_dir_effective: "{{ manifest_backup_dir | default('/etc/kubernetes/manifest-backups') }}"
    manifest_backup_suffix_effective: "{{ manifest_backup_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    kube_apiserver_manifest_effective: "{{ kube_apiserver_manifest | default(manifest_dir_effective + '/kube-apiserver.yaml') }}"
    kube_controller_manager_manifest_effective: "{{ kube_controller_manager_manifest | default(manifest_dir_effective + '/kube-controller-manager.yaml') }}"
    python_interpreter_effective: "{{ python_interpreter | default('/usr/bin/python3') }}"
    root_pki_promotions:
      - label: root CA certificate
        src: "{{ pki_dir_effective }}/ca-new-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/ca.crt"
      - label: root CA private key
        src: "{{ pki_dir_effective }}/ca-new-{{ renewal_id_effective }}.key"
        dest: "{{ pki_dir_effective }}/ca.key"
      - label: root CA bundle
        src: "{{ pki_dir_effective }}/ca-bundle-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/ca-bundle.crt"
        require_active: false
      - label: API server certificate
        src: "{{ pki_dir_effective }}/apiserver-new-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/apiserver.crt"
      - label: API server private key
        src: "{{ pki_dir_effective }}/apiserver-new-{{ renewal_id_effective }}.key"
        dest: "{{ pki_dir_effective }}/apiserver.key"
      - label: API server kubelet client certificate
        src: "{{ pki_dir_effective }}/apiserver-kubelet-client-new-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/apiserver-kubelet-client.crt"
      - label: API server kubelet client private key
        src: "{{ pki_dir_effective }}/apiserver-kubelet-client-new-{{ renewal_id_effective }}.key"
        dest: "{{ pki_dir_effective }}/apiserver-kubelet-client.key"
      - label: admin kubeconfig
        src: "{{ kube_dir_effective }}/admin-new-{{ renewal_id_effective }}.conf"
        dest: "{{ kube_dir_effective }}/admin.conf"
      - label: controller-manager kubeconfig
        src: "{{ kube_dir_effective }}/controller-manager-new-{{ renewal_id_effective }}.conf"
        dest: "{{ kube_dir_effective }}/controller-manager.conf"
      - label: scheduler kubeconfig
        src: "{{ kube_dir_effective }}/scheduler-new-{{ renewal_id_effective }}.conf"
        dest: "{{ kube_dir_effective }}/scheduler.conf"
    root_pki_promotions_effective: "{{ root_promotions | default(root_pki_promotions) }}"
    root_apiserver_manifest_arguments:
      - key: "--client-ca-file"
        value: "{{ pki_dir_effective }}/ca.crt"
        anchor: '^\s*-\s*--authorization-mode='
      - key: "--tls-cert-file"
        value: "{{ pki_dir_effective }}/apiserver.crt"
        anchor: '^\s*-\s*--client-ca-file='
      - key: "--tls-private-key-file"
        value: "{{ pki_dir_effective }}/apiserver.key"
        anchor: '^\s*-\s*--tls-cert-file='
      - key: "--kubelet-client-certificate"
        value: "{{ pki_dir_effective }}/apiserver-kubelet-client.crt"
        anchor: '^\s*-\s*--tls-private-key-file='
      - key: "--kubelet-client-key"
        value: "{{ pki_dir_effective }}/apiserver-kubelet-client.key"
        anchor: '^\s*-\s*--kubelet-client-certificate='
    root_controller_manager_manifest_arguments:
      - key: "--root-ca-file"
        value: "{{ pki_dir_effective }}/ca.crt"
        anchor: '^\s*-\s*--cluster-cidr='
      - key: "--cluster-signing-cert-file"
        value: "{{ pki_dir_effective }}/ca.crt"
        anchor: '^\s*-\s*--root-ca-file='
      - key: "--cluster-signing-key-file"
        value: "{{ pki_dir_effective }}/ca.key"
        anchor: '^\s*-\s*--cluster-signing-cert-file='
  tasks:
    - name: Validate root PKI archive and promotion parameters
      ansible.builtin.assert:
        that:
          - promotion_scope_effective in ['all', 'root', 'front-proxy', 'etcd']
          - pki_dir_effective | length > 0
          - kube_dir_effective | length > 0
          - renewal_id_effective | length > 0
          - archive_dir_effective | length > 0
          - archive_suffix_effective | length > 0
          - file_move_command_effective | length > 0
          - manifest_dir_effective | length > 0
          - manifest_backup_dir_effective | length > 0
          - manifest_backup_suffix_effective | length > 0
          - kube_apiserver_manifest_effective | length > 0
          - kube_controller_manager_manifest_effective | length > 0
          - python_interpreter_effective | length > 0
          - root_pki_promotions_effective | length > 0
          - root_pki_promotions_effective | map(attribute='src') | unique | length == root_pki_promotions_effective | length
          - root_pki_promotions_effective | map(attribute='dest') | unique | length == root_pki_promotions_effective | length
        fail_msg: Set non-empty, distinct root PKI source and destination paths.
      when: promote_root_effective | bool

    - name: Check renewed root PKI source files
      ansible.builtin.stat:
        path: "{{ item.src }}"
      loop: "{{ root_pki_promotions_effective }}"
      register: root_source_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_root_effective | bool

    - name: Fail when no renewed root PKI source files were found
      ansible.builtin.assert:
        that:
          - root_source_files.results | selectattr('stat.exists') | list | length > 0
        fail_msg: "No renewed root PKI source files were found for renewal_id={{ renewal_id_effective }}."
      when:
        - promote_root_effective | bool
        - require_renewed_sources_effective | bool

    - name: Check active root PKI destination files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ root_pki_promotions_effective }}"
      register: root_destination_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_root_effective | bool

    - name: Fail when an active root PKI destination file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Active root PKI destination file is missing or not regular: {{ item.item.dest }}"
      loop: "{{ root_destination_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label }}"
      when:
        - promote_root_effective | bool
        - require_active_files_effective | bool
        - item.item.require_active | default(true) | bool

    - name: Create root PKI archive directory
      ansible.builtin.file:
        path: "{{ archive_dir_effective }}"
        state: directory
        mode: "0700"
      when: promote_root_effective | bool

    - name: Check root PKI archive path collisions
      ansible.builtin.stat:
        path: "{{ archive_dir_effective }}/{{ item.0.item.dest | basename }}.{{ archive_suffix_effective }}"
      loop: "{{ root_source_files.results | default([]) | zip(root_destination_files.results | default([])) | list }}"
      register: root_archive_files
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_root_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Fail when a root PKI archive target already exists
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "Archive target already exists and would be overwritten: {{ archive_dir_effective }}/{{ item.item.0.item.dest | basename }}.{{ archive_suffix_effective }}"
      loop: "{{ root_archive_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.0.item.label }}"
      when:
        - promote_root_effective | bool
        - not item.skipped | default(false)

    - name: Archive active root PKI destination files
      ansible.builtin.copy:
        src: "{{ item.0.item.dest }}"
        dest: "{{ archive_dir_effective }}/{{ item.0.item.dest | basename }}.{{ archive_suffix_effective }}"
        remote_src: true
        mode: preserve
      loop: "{{ root_source_files.results | default([]) | zip(root_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_root_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Promote renewed root PKI files to active names
      ansible.builtin.command:
        argv:
          - "{{ file_move_command_effective }}"
          - "-f"
          - "{{ item.0.item.src }}"
          - "{{ item.0.item.dest }}"
      loop: "{{ root_source_files.results | default([]) | zip(root_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_root_effective | bool
        - item.0.stat.exists
        - not item.1.stat.exists or item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Remove duplicate renewed root PKI source files
      ansible.builtin.file:
        path: "{{ item.0.item.src }}"
        state: absent
      loop: "{{ root_source_files.results | default([]) | zip(root_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_root_effective | bool
        - remove_duplicate_sources_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') == item.1.stat.checksum | default('')

    - name: Verify promoted root PKI files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ root_pki_promotions_effective }}"
      register: promoted_root_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_root_effective | bool

    - name: Fail when a promoted root PKI destination is missing
      ansible.builtin.assert:
        that:
          - item.1.stat.exists
          - item.1.stat.isreg
        fail_msg: "Promoted root PKI destination is missing or not regular: {{ item.0.item.dest }}"
      loop: "{{ root_source_files.results | default([]) | zip(promoted_root_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_root_effective | bool
        - item.0.stat.exists or item.0.item.require_active | default(true) | bool

    - name: Check root PKI static pod manifests
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - label: kube-apiserver manifest
          path: "{{ kube_apiserver_manifest_effective }}"
        - label: kube-controller-manager manifest
          path: "{{ kube_controller_manager_manifest_effective }}"
      register: root_manifest_files
      loop_control:
        label: "{{ item.label }}"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Fail when a root PKI static pod manifest is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required root PKI static pod manifest is missing or not regular: {{ item.item.path }}"
      loop: "{{ root_manifest_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label }}"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Create root PKI manifest backup directory
      ansible.builtin.file:
        path: "{{ manifest_backup_dir_effective }}"
        state: directory
        mode: "0700"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Back up root PKI static pod manifests
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ manifest_backup_dir_effective }}/{{ item.path | basename }}.archive-{{ renewal_id_effective }}.{{ manifest_backup_suffix_effective }}"
        remote_src: true
        mode: preserve
      loop:
        - "{{ {'path': kube_apiserver_manifest_effective} }}"
        - "{{ {'path': kube_controller_manager_manifest_effective} }}"
      loop_control:
        label: "{{ item.path }}"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Configure kube-apiserver canonical root PKI paths
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import re
            import sys

            path = pathlib.Path(sys.argv[1])
            replacements = json.loads(sys.argv[2])
            fallback_anchors = json.loads(sys.argv[3])
            managed_keys = {item["key"] for item in replacements}
            original = path.read_text()
            lines = original.splitlines(keepends=True)
            filtered = []
            insert_at = None
            command_prefix = None

            for line in lines:
                stripped = line.rstrip("\r\n")
                match = None
                for key in managed_keys:
                    match = re.match(r"^(\s*-\s*)" + re.escape(key) + r"=.*$", stripped)
                    if match:
                        break
                if match:
                    if insert_at is None:
                        insert_at = len(filtered)
                    if command_prefix is None:
                        command_prefix = match.group(1)
                    continue
                filtered.append(line)

            if insert_at is None:
                for index, line in enumerate(filtered):
                    stripped = line.rstrip("\r\n")
                    for anchor in fallback_anchors:
                        match = re.match(r"^(\s*-\s*)" + re.escape(anchor) + r"=.*$", stripped)
                        if match:
                            insert_at = index + 1
                            command_prefix = match.group(1)
                            break
                    if insert_at is not None:
                        break

            if insert_at is None:
                raise SystemExit(f"{path}: no managed arguments or insertion anchors were found")

            new_arguments = [f"{command_prefix}{item['key']}={item['value']}\n" for item in replacements]
            updated = "".join(filtered[:insert_at] + new_arguments + filtered[insert_at:])
            if updated != original:
                path.write_text(updated)
                print("changed=true")
            else:
                print("changed=false")
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ root_apiserver_manifest_arguments | to_json }}"
          - "{{ ['--authorization-mode', '--secure-port'] | to_json }}"
      register: configure_apiserver_canonical_root_pki
      changed_when: "'changed=true' in configure_apiserver_canonical_root_pki.stdout"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Configure kube-controller-manager canonical root PKI paths
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import re
            import sys

            path = pathlib.Path(sys.argv[1])
            replacements = json.loads(sys.argv[2])
            fallback_anchors = json.loads(sys.argv[3])
            managed_keys = {item["key"] for item in replacements}
            original = path.read_text()
            lines = original.splitlines(keepends=True)
            filtered = []
            insert_at = None
            command_prefix = None

            for line in lines:
                stripped = line.rstrip("\r\n")
                match = None
                for key in managed_keys:
                    match = re.match(r"^(\s*-\s*)" + re.escape(key) + r"=.*$", stripped)
                    if match:
                        break
                if match:
                    if insert_at is None:
                        insert_at = len(filtered)
                    if command_prefix is None:
                        command_prefix = match.group(1)
                    continue
                filtered.append(line)

            if insert_at is None:
                for index, line in enumerate(filtered):
                    stripped = line.rstrip("\r\n")
                    for anchor in fallback_anchors:
                        match = re.match(r"^(\s*-\s*)" + re.escape(anchor) + r"=.*$", stripped)
                        if match:
                            insert_at = index + 1
                            command_prefix = match.group(1)
                            break
                    if insert_at is not None:
                        break

            if insert_at is None:
                raise SystemExit(f"{path}: no managed arguments or insertion anchors were found")

            new_arguments = [f"{command_prefix}{item['key']}={item['value']}\n" for item in replacements]
            updated = "".join(filtered[:insert_at] + new_arguments + filtered[insert_at:])
            if updated != original:
                path.write_text(updated)
                print("changed=true")
            else:
                print("changed=false")
          - "{{ kube_controller_manager_manifest_effective }}"
          - "{{ root_controller_manager_manifest_arguments | to_json }}"
          - "{{ ['--cluster-cidr', '--controllers', '--kubeconfig'] | to_json }}"
      register: configure_controller_manager_canonical_root_pki
      changed_when: "'changed=true' in configure_controller_manager_canonical_root_pki.stdout"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Verify canonical root PKI manifest arguments
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import sys

            def read_command(path):
                command = []
                for line in pathlib.Path(path).read_text().splitlines():
                    stripped = line.strip()
                    if stripped.startswith("- --") and "=" in stripped:
                        command.append(stripped[2:])
                return command

            failed = False
            for path, expected_json in ((sys.argv[1], sys.argv[3]), (sys.argv[2], sys.argv[4])):
                command = read_command(path)
                expected = json.loads(expected_json)
                for item in expected:
                    expected_arg = f"{item['key']}={item['value']}"
                    if command.count(expected_arg) != 1:
                        print(f"{path}: expected one {expected_arg}", file=sys.stderr)
                        failed = True
                for key in {item["key"] for item in expected}:
                    expected_count = sum(1 for item in expected if item["key"] == key)
                    actual_count = sum(1 for arg in command if arg.startswith(key + "="))
                    if actual_count != expected_count:
                        print(f"{path}: expected {expected_count} {key} entries, found {actual_count}", file=sys.stderr)
                        failed = True
            if failed:
                raise SystemExit(1)
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ kube_controller_manager_manifest_effective }}"
          - "{{ root_apiserver_manifest_arguments | to_json }}"
          - "{{ root_controller_manager_manifest_arguments | to_json }}"
      changed_when: false
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Trigger root PKI static pod restarts
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
      loop:
        - "{{ kube_apiserver_manifest_effective }}"
        - "{{ kube_controller_manager_manifest_effective }}"
      when:
        - promote_root_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_static_pods_effective | bool

- name: Archive active front-proxy PKI files and promote renewed files
  hosts: "{{ front_proxy_target_hosts | default(target_hosts | default('masters')) }}"
  become: true
  gather_facts: true
  serial: "{{ archive_promote_serial | default(1) }}"
  vars:
    promotion_scope_effective: "{{ promotion_scope | default('all') }}"
    promote_front_proxy_effective: "{{ promote_front_proxy | default(promotion_scope_effective in ['all', 'front-proxy']) }}"
    pki_dir_effective: "{{ pki_dir | default('/etc/kubernetes/pki') }}"
    renewal_id_effective: "{{ front_proxy_ca_renewal_id | default(front_proxy_cert_renewal_id | default(renewal_id | default((ansible_date_time.date | regex_replace('-', '')) ~ ansible_date_time.hour))) }}"
    archive_dir_effective: "{{ front_proxy_archive_dir | default(pki_dir_effective + '/archive/front-proxy-' + renewal_id_effective) }}"
    archive_suffix_effective: "{{ archive_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    require_active_files_effective: "{{ require_active_files | default(true) }}"
    require_renewed_sources_effective: "{{ require_renewed_sources | default(true) }}"
    remove_duplicate_sources_effective: "{{ remove_duplicate_sources | default(true) }}"
    canonicalize_manifests_effective: "{{ canonicalize_manifests | default(true) }}"
    restart_static_pods_effective: "{{ restart_static_pods | default(false) }}"
    restart_metrics_server_effective: "{{ restart_metrics_server | default(true) }}"
    metrics_server_namespace_effective: "{{ metrics_server_namespace | default('kube-system') }}"
    metrics_server_deployment_effective: "{{ metrics_server_deployment | default('metrics-server') }}"
    metrics_server_rollout_timeout_effective: "{{ metrics_server_rollout_timeout | default('300s') }}"
    kubeconfig_effective: "{{ kubeconfig | default('/etc/kubernetes/admin.conf') }}"
    kubectl_retries_effective: "{{ kubectl_retries | default(30) }}"
    kubectl_delay_effective: "{{ kubectl_delay | default(10) }}"
    file_move_command_effective: "{{ file_move_command | default('mv') }}"
    manifest_dir_effective: "{{ manifest_dir | default('/etc/kubernetes/manifests') }}"
    manifest_backup_dir_effective: "{{ manifest_backup_dir | default('/etc/kubernetes/manifest-backups') }}"
    manifest_backup_suffix_effective: "{{ manifest_backup_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    kube_apiserver_manifest_effective: "{{ kube_apiserver_manifest | default(manifest_dir_effective + '/kube-apiserver.yaml') }}"
    python_interpreter_effective: "{{ python_interpreter | default('/usr/bin/python3') }}"
    front_proxy_pki_promotions:
      - label: front-proxy CA certificate
        src: "{{ pki_dir_effective }}/front-proxy-ca-new-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/front-proxy-ca.crt"
      - label: front-proxy CA private key
        src: "{{ pki_dir_effective }}/front-proxy-ca-new-{{ renewal_id_effective }}.key"
        dest: "{{ pki_dir_effective }}/front-proxy-ca.key"
      - label: front-proxy CA bundle
        src: "{{ pki_dir_effective }}/front-proxy-ca-bundle-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/front-proxy-ca-bundle.crt"
        require_active: false
      - label: front-proxy client certificate
        src: "{{ pki_dir_effective }}/front-proxy-client-new-{{ renewal_id_effective }}.crt"
        dest: "{{ pki_dir_effective }}/front-proxy-client.crt"
      - label: front-proxy client private key
        src: "{{ pki_dir_effective }}/front-proxy-client-new-{{ renewal_id_effective }}.key"
        dest: "{{ pki_dir_effective }}/front-proxy-client.key"
    front_proxy_pki_promotions_effective: "{{ front_proxy_promotions | default(front_proxy_pki_promotions) }}"
    front_proxy_manifest_arguments:
      - key: "--requestheader-client-ca-file"
        value: "{{ pki_dir_effective }}/front-proxy-ca.crt"
        anchor: '^\s*-\s*--proxy-client-cert-file='
      - key: "--proxy-client-cert-file"
        value: "{{ pki_dir_effective }}/front-proxy-client.crt"
        anchor: '^\s*-\s*--requestheader-client-ca-file='
      - key: "--proxy-client-key-file"
        value: "{{ pki_dir_effective }}/front-proxy-client.key"
        anchor: '^\s*-\s*--proxy-client-cert-file='
  tasks:
    - name: Validate front-proxy PKI archive and promotion parameters
      ansible.builtin.assert:
        that:
          - promotion_scope_effective in ['all', 'root', 'front-proxy', 'etcd']
          - pki_dir_effective | length > 0
          - renewal_id_effective | length > 0
          - archive_dir_effective | length > 0
          - archive_suffix_effective | length > 0
          - file_move_command_effective | length > 0
          - manifest_dir_effective | length > 0
          - manifest_backup_dir_effective | length > 0
          - manifest_backup_suffix_effective | length > 0
          - kube_apiserver_manifest_effective | length > 0
          - python_interpreter_effective | length > 0
          - front_proxy_pki_promotions_effective | length > 0
          - front_proxy_pki_promotions_effective | map(attribute='src') | unique | length == front_proxy_pki_promotions_effective | length
          - front_proxy_pki_promotions_effective | map(attribute='dest') | unique | length == front_proxy_pki_promotions_effective | length
        fail_msg: Set non-empty, distinct front-proxy PKI source and destination paths.
      when: promote_front_proxy_effective | bool

    - name: Check renewed front-proxy PKI source files
      ansible.builtin.stat:
        path: "{{ item.src }}"
      loop: "{{ front_proxy_pki_promotions_effective }}"
      register: front_proxy_source_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_front_proxy_effective | bool

    - name: Fail when no renewed front-proxy PKI source files were found
      ansible.builtin.assert:
        that:
          - front_proxy_source_files.results | selectattr('stat.exists') | list | length > 0
        fail_msg: "No renewed front-proxy PKI source files were found for renewal_id={{ renewal_id_effective }}."
      when:
        - promote_front_proxy_effective | bool
        - require_renewed_sources_effective | bool

    - name: Check active front-proxy PKI destination files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ front_proxy_pki_promotions_effective }}"
      register: front_proxy_destination_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_front_proxy_effective | bool

    - name: Fail when an active front-proxy PKI destination file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Active front-proxy PKI destination file is missing or not regular: {{ item.item.dest }}"
      loop: "{{ front_proxy_destination_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - require_active_files_effective | bool
        - item.item.require_active | default(true) | bool

    - name: Create front-proxy PKI archive directory
      ansible.builtin.file:
        path: "{{ archive_dir_effective }}"
        state: directory
        mode: "0700"
      when: promote_front_proxy_effective | bool

    - name: Check front-proxy PKI archive path collisions
      ansible.builtin.stat:
        path: "{{ archive_dir_effective }}/{{ item.0.item.dest | basename }}.{{ archive_suffix_effective }}"
      loop: "{{ front_proxy_source_files.results | default([]) | zip(front_proxy_destination_files.results | default([])) | list }}"
      register: front_proxy_archive_files
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Fail when a front-proxy PKI archive target already exists
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "Archive target already exists and would be overwritten: {{ archive_dir_effective }}/{{ item.item.0.item.dest | basename }}.{{ archive_suffix_effective }}"
      loop: "{{ front_proxy_archive_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.0.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - not item.skipped | default(false)

    - name: Archive active front-proxy PKI destination files
      ansible.builtin.copy:
        src: "{{ item.0.item.dest }}"
        dest: "{{ archive_dir_effective }}/{{ item.0.item.dest | basename }}.{{ archive_suffix_effective }}"
        remote_src: true
        mode: preserve
      loop: "{{ front_proxy_source_files.results | default([]) | zip(front_proxy_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Promote renewed front-proxy PKI files to active names
      ansible.builtin.command:
        argv:
          - "{{ file_move_command_effective }}"
          - "-f"
          - "{{ item.0.item.src }}"
          - "{{ item.0.item.dest }}"
      loop: "{{ front_proxy_source_files.results | default([]) | zip(front_proxy_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - item.0.stat.exists
        - not item.1.stat.exists or item.0.stat.checksum | default('') != item.1.stat.checksum | default('')

    - name: Remove duplicate renewed front-proxy PKI source files
      ansible.builtin.file:
        path: "{{ item.0.item.src }}"
        state: absent
      loop: "{{ front_proxy_source_files.results | default([]) | zip(front_proxy_destination_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - remove_duplicate_sources_effective | bool
        - item.0.stat.exists
        - item.1.stat.exists
        - item.0.stat.checksum | default('') == item.1.stat.checksum | default('')

    - name: Verify promoted front-proxy PKI files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ front_proxy_pki_promotions_effective }}"
      register: promoted_front_proxy_files
      loop_control:
        label: "{{ item.label }}"
      when: promote_front_proxy_effective | bool

    - name: Fail when a promoted front-proxy PKI destination is missing
      ansible.builtin.assert:
        that:
          - item.1.stat.exists
          - item.1.stat.isreg
        fail_msg: "Promoted front-proxy PKI destination is missing or not regular: {{ item.0.item.dest }}"
      loop: "{{ front_proxy_source_files.results | default([]) | zip(promoted_front_proxy_files.results | default([])) | list }}"
      loop_control:
        label: "{{ item.0.item.label }}"
      when:
        - promote_front_proxy_effective | bool
        - item.0.stat.exists or item.0.item.require_active | default(true) | bool

    - name: Check front-proxy static pod manifest
      ansible.builtin.stat:
        path: "{{ kube_apiserver_manifest_effective }}"
      register: front_proxy_manifest_file
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Fail when the front-proxy static pod manifest is missing
      ansible.builtin.assert:
        that:
          - front_proxy_manifest_file.stat.exists
          - front_proxy_manifest_file.stat.isreg
        fail_msg: "Required front-proxy static pod manifest is missing or not regular: {{ kube_apiserver_manifest_effective }}"
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Create front-proxy manifest backup directory
      ansible.builtin.file:
        path: "{{ manifest_backup_dir_effective }}"
        state: directory
        mode: "0700"
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Back up front-proxy static pod manifest
      ansible.builtin.copy:
        src: "{{ kube_apiserver_manifest_effective }}"
        dest: "{{ manifest_backup_dir_effective }}/{{ kube_apiserver_manifest_effective | basename }}.front-proxy-archive-{{ renewal_id_effective }}.{{ manifest_backup_suffix_effective }}"
        remote_src: true
        mode: preserve
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Configure kube-apiserver canonical front-proxy PKI paths
      ansible.builtin.lineinfile:
        path: "{{ kube_apiserver_manifest_effective }}"
        regexp: '^\s*-\s*{{ item.key | regex_escape }}='
        line: "    - {{ item.key }}={{ item.value }}"
        insertafter: "{{ item.anchor }}"
        firstmatch: true
      loop: "{{ front_proxy_manifest_arguments }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Verify canonical front-proxy manifest arguments
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import sys

            command = []
            for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
                stripped = line.strip()
                if stripped.startswith("- --") and "=" in stripped:
                    command.append(stripped[2:])
            failed = False
            expected = json.loads(sys.argv[2])
            for item in expected:
                expected_arg = f"{item['key']}={item['value']}"
                if command.count(expected_arg) != 1:
                    print(f"{sys.argv[1]}: expected one {expected_arg}", file=sys.stderr)
                    failed = True
            for key in {item["key"] for item in expected}:
                expected_count = sum(1 for item in expected if item["key"] == key)
                actual_count = sum(1 for arg in command if arg.startswith(key + "="))
                if actual_count != expected_count:
                    print(f"{sys.argv[1]}: expected {expected_count} {key} entries, found {actual_count}", file=sys.stderr)
                    failed = True
            if failed:
                raise SystemExit(1)
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ front_proxy_manifest_arguments | to_json }}"
      changed_when: false
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool

    - name: Trigger front-proxy static pod restart
      ansible.builtin.file:
        path: "{{ kube_apiserver_manifest_effective }}"
        state: touch
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_static_pods_effective | bool

    - name: Wait for kube-apiserver to publish updated extension-apiserver-authentication ConfigMap
      ansible.builtin.command: >-
        kubectl --kubeconfig={{ kubeconfig_effective }}
        get cm extension-apiserver-authentication
        -n kube-system
        -o jsonpath='{.data.requestheader-client-ca-file}'
      register: front_proxy_ca_configmap
      changed_when: false
      until: front_proxy_ca_configmap.rc == 0
      retries: "{{ kubectl_retries_effective }}"
      delay: "{{ kubectl_delay_effective }}"
      run_once: true
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_metrics_server_effective | bool

    - name: Check whether metrics-server deployment exists
      ansible.builtin.command: >-
        kubectl --kubeconfig={{ kubeconfig_effective }}
        get deployment/{{ metrics_server_deployment_effective }}
        -n {{ metrics_server_namespace_effective }}
      register: metrics_server_deployment_check
      changed_when: false
      failed_when: false
      run_once: true
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_metrics_server_effective | bool

    - name: Restart metrics-server deployment
      ansible.builtin.command: >-
        kubectl --kubeconfig={{ kubeconfig_effective }}
        rollout restart deployment/{{ metrics_server_deployment_effective }}
        -n {{ metrics_server_namespace_effective }}
      register: metrics_server_restart
      changed_when: metrics_server_restart.rc == 0
      run_once: true
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_metrics_server_effective | bool
        - metrics_server_deployment_check.rc == 0

    - name: Wait for metrics-server rollout to complete
      ansible.builtin.command: >-
        kubectl --kubeconfig={{ kubeconfig_effective }}
        rollout status deployment/{{ metrics_server_deployment_effective }}
        -n {{ metrics_server_namespace_effective }}
        --timeout={{ metrics_server_rollout_timeout_effective }}
      changed_when: false
      run_once: true
      when:
        - promote_front_proxy_effective | bool
        - canonicalize_manifests_effective | bool
        - restart_metrics_server_effective | bool
        - metrics_server_deployment_check.rc == 0

- name: Archive active etcd PKI files and promote renewed files
  hosts: "{{ etcd_target_hosts | default(target_hosts | default('etcd_members')) }}"
  become: true
  gather_facts: true
  serial: "{{ archive_promote_serial | default(1) }}"
  vars:
