          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Promoted etcd PKI destination is missing or not regular: {{ item.item.dest }}"
      loop: "{{ promoted_etcd_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.label }}"
      when: promote_etcd_effective | bool
