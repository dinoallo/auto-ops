---
- name: Generate ServiceAccount signing key pair
  hosts: "{{ target_hosts | default('masters') }}"
  become: true
  gather_facts: true
  vars:
    service_account_source_host_effective: "{{ service_account_source_host | default(ansible_play_hosts_all[0]) }}"
    pki_dir_effective: "{{ pki_dir | default('/etc/kubernetes/pki') }}"
    service_account_active_public_key_effective: "{{ service_account_active_public_key | default('sa.pub') }}"
    service_account_active_private_key_effective: "{{ service_account_active_private_key | default('sa.key') }}"
    service_account_renewal_id_effective: "{{ service_account_renewal_id | default(renewal_id | default((hostvars[ansible_play_hosts_all[0]].ansible_date_time.date | regex_replace('-', '')) ~ hostvars[ansible_play_hosts_all[0]].ansible_date_time.hour)) }}"
    service_account_new_key_effective: "{{ service_account_new_key | default('sa-new-' ~ service_account_renewal_id_effective ~ '.key') }}"
    service_account_new_public_key_effective: "{{ service_account_new_public_key | default('sa-new-' ~ service_account_renewal_id_effective ~ '.pub') }}"
    service_account_key_bits_effective: "{{ service_account_key_bits | default(4096) }}"
    service_account_new_key_mode_effective: "{{ service_account_new_key_mode | default('0600') }}"
    service_account_new_public_key_mode_effective: "{{ service_account_new_public_key_mode | default('0644') }}"
    openssl_command_effective: "{{ openssl_command | default('openssl') }}"
    diff_command_effective: "{{ diff_command | default('diff') }}"
    service_account_generated_files:
      - path: "{{ service_account_new_key_effective }}"
        mode: "{{ service_account_new_key_mode_effective }}"
      - path: "{{ service_account_new_public_key_effective }}"
        mode: "{{ service_account_new_public_key_mode_effective }}"
    service_account_managed_filenames:
      - "{{ service_account_active_public_key_effective }}"
      - "{{ service_account_active_private_key_effective }}"
      - "{{ service_account_new_key_effective }}"
      - "{{ service_account_new_public_key_effective }}"
  tasks:
    - name: Validate ServiceAccount key generation parameters
      ansible.builtin.assert:
        that:
          - pki_dir_effective | length > 0
          - service_account_active_public_key_effective | length > 0
          - service_account_active_private_key_effective | length > 0
          - service_account_new_key_effective | length > 0
          - service_account_new_public_key_effective | length > 0
          - service_account_key_bits_effective | int > 0
          - service_account_source_host_effective in ansible_play_hosts_all
          - service_account_managed_filenames | unique | length == service_account_managed_filenames | length
        fail_msg: Set non-empty, distinct ServiceAccount key names and a positive key size.

    - name: Check active ServiceAccount files
      ansible.builtin.stat:
        path: "{{ pki_dir_effective }}/{{ item }}"
      loop:
        - "{{ service_account_active_public_key_effective }}"
        - "{{ service_account_active_private_key_effective }}"
      register: active_service_account_files

    - name: Fail when an active ServiceAccount file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Active ServiceAccount file is missing or not regular: {{ pki_dir_effective }}/{{ item.item }}"
      loop: "{{ active_service_account_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify active ServiceAccount key pair
      ansible.builtin.shell: |
        set -euo pipefail
        verify_file="$(mktemp)"
        trap 'rm -f "${verify_file}"' EXIT
        "{{ openssl_command_effective }}" rsa -in "{{ service_account_active_private_key_effective }}" -pubout -out "${verify_file}"
        "{{ diff_command_effective }}" -u "{{ service_account_active_public_key_effective }}" "${verify_file}"
      args:
        chdir: "{{ pki_dir_effective }}"
        executable: /bin/bash
      changed_when: false

    - name: Generate new ServiceAccount signing key
      ansible.builtin.command:
        argv:
          - "{{ openssl_command_effective }}"
          - genrsa
          - "-out"
          - "{{ service_account_new_key_effective }}"
          - "{{ service_account_key_bits_effective | string }}"
      args:
        chdir: "{{ pki_dir_effective }}"
        creates: "{{ pki_dir_effective }}/{{ service_account_new_key_effective }}"
      delegate_to: "{{ service_account_source_host_effective }}"
      run_once: true

    - name: Derive new ServiceAccount public key
      ansible.builtin.command:
        argv:
          - "{{ openssl_command_effective }}"
          - rsa
          - "-in"
          - "{{ service_account_new_key_effective }}"
          - "-pubout"
          - "-out"
          - "{{ service_account_new_public_key_effective }}"
      args:
        chdir: "{{ pki_dir_effective }}"
        creates: "{{ pki_dir_effective }}/{{ service_account_new_public_key_effective }}"
      delegate_to: "{{ service_account_source_host_effective }}"
      run_once: true

    - name: Set source ServiceAccount key permissions
      ansible.builtin.file:
        path: "{{ pki_dir_effective }}/{{ item.path }}"
        mode: "{{ item.mode }}"
      loop: "{{ service_account_generated_files }}"
      delegate_to: "{{ service_account_source_host_effective }}"
      run_once: true

    - name: Verify staged ServiceAccount key pair on source host
      ansible.builtin.shell: |
        set -euo pipefail
        verify_file="$(mktemp)"
        trap 'rm -f "${verify_file}"' EXIT
        "{{ openssl_command_effective }}" rsa -in "{{ service_account_new_key_effective }}" -pubout -out "${verify_file}"
        "{{ diff_command_effective }}" -u "{{ service_account_new_public_key_effective }}" "${verify_file}"
      args:
        chdir: "{{ pki_dir_effective }}"
        executable: /bin/bash
      delegate_to: "{{ service_account_source_host_effective }}"
      run_once: true
      changed_when: false

    - name: Read generated ServiceAccount files from source host
      ansible.builtin.slurp:
        src: "{{ pki_dir_effective }}/{{ item.path }}"
      loop: "{{ service_account_generated_files }}"
      register: generated_service_account_files
      delegate_to: "{{ service_account_source_host_effective }}"
      run_once: true
      no_log: true

    - name: Install generated ServiceAccount files on target hosts
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ pki_dir_effective }}/{{ item.item.path }}"
        mode: "{{ item.item.mode }}"
      loop: "{{ generated_service_account_files.results }}"
      no_log: true

    - name: Verify staged ServiceAccount key pair on target hosts
      ansible.builtin.shell: |
        set -euo pipefail
        verify_file="$(mktemp)"
        trap 'rm -f "${verify_file}"' EXIT
        "{{ openssl_command_effective }}" rsa -in "{{ service_account_new_key_effective }}" -pubout -out "${verify_file}"
        "{{ diff_command_effective }}" -u "{{ service_account_new_public_key_effective }}" "${verify_file}"
      args:
        chdir: "{{ pki_dir_effective }}"
        executable: /bin/bash
      changed_when: false
