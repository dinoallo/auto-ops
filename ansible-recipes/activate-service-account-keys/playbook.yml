---
- name: Audit ServiceAccount token retirement before key activation
  import_playbook: ../audit-service-account-token-retirement/playbook.yml
  vars:
    audit_legacy_service_account_tokens: "{{ audit_service_account_token_retirement | default(true) }}"
    audit_projected_service_account_tokens: "{{ activate_audit_projected_service_account_tokens | default(audit_service_account_token_retirement | default(true)) }}"
    audit_projected_ca_bundle: "{{ activate_audit_projected_ca_bundle | default(false) }}"

- name: Activate staged ServiceAccount signing key pair
  hosts: "{{ target_hosts | default('masters') }}"
  become: true
  gather_facts: true
  serial: "{{ service_account_key_activation_rollout_serial | default(1) }}"
  vars:
    manifest_dir_effective: "{{ manifest_dir | default('/etc/kubernetes/manifests') }}"
    pki_dir_effective: "{{ pki_dir | default('/etc/kubernetes/pki') }}"
    manifest_backup_dir_effective: "{{ manifest_backup_dir | default('/etc/kubernetes/manifest-backups') }}"
    service_account_renewal_id_effective: "{{ service_account_renewal_id | default(renewal_id | default((ansible_date_time.date | regex_replace('-', '')) ~ ansible_date_time.hour)) }}"
    service_account_archive_dir_effective: "{{ service_account_archive_dir | default(pki_dir_effective + '/archive/service-account-' + service_account_renewal_id_effective) }}"
    archive_suffix_effective: "{{ archive_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    manifest_backup_suffix_effective: "{{ manifest_backup_suffix | default(ansible_date_time.iso8601_basic_short + '.bak') }}"
    service_account_active_public_key_effective: "{{ service_account_active_public_key | default('sa.pub') }}"
    service_account_active_private_key_effective: "{{ service_account_active_private_key | default('sa.key') }}"
    service_account_staged_public_key_effective: "{{ service_account_staged_public_key | default('sa-new-' ~ service_account_renewal_id_effective ~ '.pub') }}"
    service_account_staged_private_key_effective: "{{ service_account_staged_private_key | default('sa-new-' ~ service_account_renewal_id_effective ~ '.key') }}"
    kube_apiserver_manifest_effective: "{{ kube_apiserver_manifest | default(manifest_dir_effective + '/kube-apiserver.yaml') }}"
    kube_controller_manager_manifest_effective: "{{ kube_controller_manager_manifest | default(manifest_dir_effective + '/kube-controller-manager.yaml') }}"
    restart_static_pods_effective: "{{ restart_static_pods | default(false) }}"
    wait_static_pods_effective: "{{ wait_static_pods | default(restart_static_pods_effective) }}"
    kubeconfig_effective: "{{ kubeconfig | default('/etc/kubernetes/admin.conf') }}"
    kubectl_command_effective: "{{ kubectl_command | default('kubectl') }}"
    python_interpreter_effective: "{{ python_interpreter | default('/usr/bin/python3') }}"
    openssl_command_effective: "{{ openssl_command | default('openssl') }}"
    diff_command_effective: "{{ diff_command | default('diff') }}"
    file_move_command_effective: "{{ file_move_command | default('mv') }}"
    remove_duplicate_sources_effective: "{{ remove_duplicate_sources | default(true) }}"
    require_compatibility_manifest_state_effective: "{{ require_compatibility_manifest_state | default(true) }}"
    service_account_active_public_key_path_effective: "{{ pki_dir_effective + '/' + service_account_active_public_key_effective }}"
    service_account_active_private_key_path_effective: "{{ pki_dir_effective + '/' + service_account_active_private_key_effective }}"
    service_account_staged_public_key_path_effective: "{{ pki_dir_effective + '/' + service_account_staged_public_key_effective }}"
    service_account_staged_private_key_path_effective: "{{ pki_dir_effective + '/' + service_account_staged_private_key_effective }}"
    service_account_file_pairs:
      - label: ServiceAccount public key
        active: "{{ service_account_active_public_key_effective }}"
        staged: "{{ service_account_staged_public_key_effective }}"
      - label: ServiceAccount private key
        active: "{{ service_account_active_private_key_effective }}"
        staged: "{{ service_account_staged_private_key_effective }}"
    service_account_all_filenames: "{{ service_account_file_pairs | map(attribute='active') | list + service_account_file_pairs | map(attribute='staged') | list }}"
    service_account_new_only_apiserver_arguments:
      - key: "--service-account-key-file"
        value: "{{ service_account_active_public_key_path_effective }}"
      - key: "--service-account-signing-key-file"
        value: "{{ service_account_active_private_key_path_effective }}"
    service_account_new_only_controller_manager_arguments:
      - key: "--service-account-private-key-file"
        value: "{{ service_account_active_private_key_path_effective }}"
    service_account_compat_apiserver_arguments:
      - key: "--service-account-key-file"
        value: "{{ service_account_active_public_key_path_effective }}"
      - key: "--service-account-key-file"
        value: "{{ service_account_staged_public_key_path_effective }}"
      - key: "--service-account-signing-key-file"
        value: "{{ service_account_staged_private_key_path_effective }}"
    service_account_compat_controller_manager_arguments:
      - key: "--service-account-private-key-file"
        value: "{{ service_account_staged_private_key_path_effective }}"
  tasks:
    - name: Validate ServiceAccount key activation parameters
      ansible.builtin.assert:
        that:
          - manifest_dir_effective | length > 0
          - pki_dir_effective | length > 0
          - manifest_backup_dir_effective | length > 0
          - service_account_archive_dir_effective | length > 0
          - archive_suffix_effective | length > 0
          - manifest_backup_suffix_effective | length > 0
          - service_account_all_filenames | unique | length == service_account_all_filenames | length
          - kube_apiserver_manifest_effective | length > 0
          - kube_controller_manager_manifest_effective | length > 0
          - kubeconfig_effective | length > 0
          - kubectl_command_effective | length > 0
          - python_interpreter_effective | length > 0
          - openssl_command_effective | length > 0
          - diff_command_effective | length > 0
          - file_move_command_effective | length > 0
        fail_msg: Set non-empty, distinct ServiceAccount key, manifest, archive, kubectl, and Python paths.

    - name: Check active and staged ServiceAccount files
      ansible.builtin.stat:
        path: "{{ pki_dir_effective }}/{{ item }}"
      loop: "{{ service_account_all_filenames }}"
      register: service_account_file_stats
      loop_control:
        label: "{{ item }}"

    - name: Fail when a required ServiceAccount file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required ServiceAccount file is missing or not regular: {{ pki_dir_effective }}/{{ item.item }}"
      loop: "{{ service_account_file_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check required static pod manifests
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - label: kube-apiserver manifest
          path: "{{ kube_apiserver_manifest_effective }}"
        - label: kube-controller-manager manifest
          path: "{{ kube_controller_manager_manifest_effective }}"
      register: service_account_manifest_files
      loop_control:
        label: "{{ item.label }}"

    - name: Fail when a required static pod manifest is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required static pod manifest is missing or not regular: {{ item.item.path }}"
      loop: "{{ service_account_manifest_files.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Verify staged ServiceAccount key pair
      ansible.builtin.shell: |
        set -euo pipefail
        verify_file="$(mktemp)"
        trap 'rm -f "${verify_file}"' EXIT
        "{{ openssl_command_effective }}" rsa -in "{{ service_account_staged_private_key_effective }}" -pubout -out "${verify_file}"
        "{{ diff_command_effective }}" -u "{{ service_account_staged_public_key_effective }}" "${verify_file}"
      args:
        chdir: "{{ pki_dir_effective }}"
        executable: /bin/bash
      changed_when: false

    - name: Verify compatibility ServiceAccount manifest state before activation
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import sys

            def read_command(path):
                command = []
                for line in pathlib.Path(path).read_text().splitlines():
                    stripped_line = line.strip()
                    if stripped_line.startswith("- --") and "=" in stripped_line:
                        command.append(stripped_line[2:])
                return command

            failed = False
            for path, expected_json in ((sys.argv[1], sys.argv[3]), (sys.argv[2], sys.argv[4])):
                command = read_command(path)
                expected = json.loads(expected_json)
                for item in expected:
                    expected_arg = f"{item['key']}={item['value']}"
                    count = command.count(expected_arg)
                    if count != 1:
                        print(f"{path}: expected one pre-activation {expected_arg} entry, found {count}", file=sys.stderr)
                        failed = True
                for key in {item["key"] for item in expected}:
                    actual_count = sum(1 for item in command if isinstance(item, str) and item.startswith(key + "="))
                    expected_count = sum(1 for item in expected if item["key"] == key)
                    if actual_count != expected_count:
                        print(f"{path}: expected {expected_count} pre-activation {key} entries, found {actual_count}", file=sys.stderr)
                        failed = True
            if failed:
                raise SystemExit(1)
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ kube_controller_manager_manifest_effective }}"
          - "{{ service_account_compat_apiserver_arguments | to_json }}"
          - "{{ service_account_compat_controller_manager_arguments | to_json }}"
      changed_when: false
      when: require_compatibility_manifest_state_effective | bool

    - name: Create ServiceAccount archive and manifest backup directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ service_account_archive_dir_effective }}"
        - "{{ manifest_backup_dir_effective }}"

    - name: Back up ServiceAccount-related static pod manifests
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: preserve
      loop:
        - src: "{{ kube_apiserver_manifest_effective }}"
          dest: "{{ manifest_backup_dir_effective }}/kube-apiserver.yaml.service-account-{{ service_account_renewal_id_effective }}.{{ manifest_backup_suffix_effective }}"
        - src: "{{ kube_controller_manager_manifest_effective }}"
          dest: "{{ manifest_backup_dir_effective }}/kube-controller-manager.yaml.service-account-{{ service_account_renewal_id_effective }}.{{ manifest_backup_suffix_effective }}"
      loop_control:
        label: "{{ item.dest }}"

    - name: Check ServiceAccount archive path collisions
      ansible.builtin.stat:
        path: "{{ service_account_archive_dir_effective }}/{{ item.active }}.{{ archive_suffix_effective }}"
      loop: "{{ service_account_file_pairs }}"
      register: service_account_archive_files
      loop_control:
        label: "{{ item.label }}"

    - name: Fail when a ServiceAccount archive target already exists
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "Archive target already exists and would be overwritten: {{ service_account_archive_dir_effective }}/{{ item.item.active }}.{{ archive_suffix_effective }}"
      loop: "{{ service_account_archive_files.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Archive active ServiceAccount files
      ansible.builtin.copy:
        src: "{{ pki_dir_effective }}/{{ item.active }}"
        dest: "{{ service_account_archive_dir_effective }}/{{ item.active }}.{{ archive_suffix_effective }}"
        remote_src: true
        mode: preserve
      loop: "{{ service_account_file_pairs }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Promote staged ServiceAccount files to active names
      ansible.builtin.command:
        argv:
          - "{{ file_move_command_effective }}"
          - "-f"
          - "{{ pki_dir_effective }}/{{ item.staged }}"
          - "{{ pki_dir_effective }}/{{ item.active }}"
      loop: "{{ service_account_file_pairs }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Remove duplicate staged ServiceAccount source files
      ansible.builtin.file:
        path: "{{ pki_dir_effective }}/{{ item.staged }}"
        state: absent
      loop: "{{ service_account_file_pairs }}"
      loop_control:
        label: "{{ item.label }}"
      when: remove_duplicate_sources_effective | bool

    - name: Configure kube-apiserver new-only ServiceAccount key arguments
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import re
            import sys

            path = pathlib.Path(sys.argv[1])
            replacements = json.loads(sys.argv[2])
            anchors = json.loads(sys.argv[3])
            managed_keys = {item["key"] for item in replacements}
            original = path.read_text()
            lines = original.splitlines(keepends=True)
            filtered = []
            insert_at = None
            command_prefix = None

            for line in lines:
                stripped_line = line.rstrip("\r\n")
                match = None
                for key in managed_keys:
                    match = re.match(r"^(\s*-\s*)" + re.escape(key) + r"=.*$", stripped_line)
                    if match:
                        break
                if match:
                    if insert_at is None:
                        insert_at = len(filtered)
                    if command_prefix is None:
                        command_prefix = match.group(1)
                    continue
                filtered.append(line)

            if insert_at is None:
                for index, line in enumerate(filtered):
                    stripped_line = line.rstrip("\r\n")
                    for anchor in anchors:
                        match = re.match(r"^(\s*-\s*)" + re.escape(anchor) + r"=.*$", stripped_line)
                        if match:
                            insert_at = index + 1
                            command_prefix = match.group(1)
                            break
                    if insert_at is not None:
                        break

            if insert_at is None:
                raise SystemExit(f"{path}: no managed apiserver arguments or insertion anchors were found")

            new_arguments = [f"{command_prefix}{item['key']}={item['value']}\n" for item in replacements]
            updated = "".join(filtered[:insert_at] + new_arguments + filtered[insert_at:])
            if updated != original:
                path.write_text(updated)
                print("changed=true")
            else:
                print("changed=false")
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ service_account_new_only_apiserver_arguments | to_json }}"
          - "{{ ['--client-ca-file', '--authorization-mode', '--secure-port'] | to_json }}"
      register: activate_kube_apiserver_service_account_keys
      changed_when: "'changed=true' in activate_kube_apiserver_service_account_keys.stdout"

    - name: Configure kube-controller-manager new-only ServiceAccount key arguments
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import re
            import sys

            path = pathlib.Path(sys.argv[1])
            replacements = json.loads(sys.argv[2])
            anchors = json.loads(sys.argv[3])
            managed_keys = {item["key"] for item in replacements}
            original = path.read_text()
            lines = original.splitlines(keepends=True)
            filtered = []
            insert_at = None
            command_prefix = None

            for line in lines:
                stripped_line = line.rstrip("\r\n")
                match = None
                for key in managed_keys:
                    match = re.match(r"^(\s*-\s*)" + re.escape(key) + r"=.*$", stripped_line)
                    if match:
                        break
                if match:
                    if insert_at is None:
                        insert_at = len(filtered)
                    if command_prefix is None:
                        command_prefix = match.group(1)
                    continue
                filtered.append(line)

            if insert_at is None:
                for index, line in enumerate(filtered):
                    stripped_line = line.rstrip("\r\n")
                    for anchor in anchors:
                        match = re.match(r"^(\s*-\s*)" + re.escape(anchor) + r"=.*$", stripped_line)
                        if match:
                            insert_at = index + 1
                            command_prefix = match.group(1)
                            break
                    if insert_at is not None:
                        break

            if insert_at is None:
                raise SystemExit(f"{path}: no managed controller-manager arguments or insertion anchors were found")

            new_arguments = [f"{command_prefix}{item['key']}={item['value']}\n" for item in replacements]
            updated = "".join(filtered[:insert_at] + new_arguments + filtered[insert_at:])
            if updated != original:
                path.write_text(updated)
                print("changed=true")
            else:
                print("changed=false")
          - "{{ kube_controller_manager_manifest_effective }}"
          - "{{ service_account_new_only_controller_manager_arguments | to_json }}"
          - "{{ ['--cluster-signing-key-file', '--cluster-cidr', '--controllers', '--kubeconfig'] | to_json }}"
      register: activate_kube_controller_manager_service_account_keys
      changed_when: "'changed=true' in activate_kube_controller_manager_service_account_keys.stdout"

    - name: Verify configured new-only ServiceAccount key arguments
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter_effective }}"
          - "-c"
          - |
            import json
            import pathlib
            import sys

            def read_command(path):
                command = []
                for line in pathlib.Path(path).read_text().splitlines():
                    stripped_line = line.strip()
                    if stripped_line.startswith("- --") and "=" in stripped_line:
                        command.append(stripped_line[2:])
                return command

            failed = False
            for path, expected_json in ((sys.argv[1], sys.argv[3]), (sys.argv[2], sys.argv[4])):
                command = read_command(path)
                expected = json.loads(expected_json)
                for item in expected:
                    expected_arg = f"{item['key']}={item['value']}"
                    count = command.count(expected_arg)
                    if count != 1:
                        print(f"{path}: expected one {expected_arg} entry, found {count}", file=sys.stderr)
                        failed = True
                for key in {item["key"] for item in expected}:
                    actual_count = sum(1 for item in command if isinstance(item, str) and item.startswith(key + "="))
                    expected_count = sum(1 for item in expected if item["key"] == key)
                    if actual_count != expected_count:
                        print(f"{path}: expected {expected_count} {key} entries, found {actual_count}", file=sys.stderr)
                        failed = True
            if failed:
                raise SystemExit(1)
          - "{{ kube_apiserver_manifest_effective }}"
          - "{{ kube_controller_manager_manifest_effective }}"
          - "{{ service_account_new_only_apiserver_arguments | to_json }}"
          - "{{ service_account_new_only_controller_manager_arguments | to_json }}"
      changed_when: false

    - name: Verify active ServiceAccount key pair
      ansible.builtin.shell: |
        set -euo pipefail
        verify_file="$(mktemp)"
        trap 'rm -f "${verify_file}"' EXIT
        "{{ openssl_command_effective }}" rsa -in "{{ service_account_active_private_key_effective }}" -pubout -out "${verify_file}"
        "{{ diff_command_effective }}" -u "{{ service_account_active_public_key_effective }}" "${verify_file}"
      args:
        chdir: "{{ pki_dir_effective }}"
        executable: /bin/bash
      changed_when: false

    - name: Trigger kube-apiserver static pod restart
      ansible.builtin.file:
        path: "{{ kube_apiserver_manifest_effective }}"
        state: touch
      when: restart_static_pods_effective | bool

    - name: Trigger kube-controller-manager static pod restart
      ansible.builtin.file:
        path: "{{ kube_controller_manager_manifest_effective }}"
        state: touch
      when: restart_static_pods_effective | bool

    - name: Read Kubernetes node name from host
      ansible.builtin.command: hostname
      register: node_name
      changed_when: false
      when: wait_static_pods_effective | bool

    - name: Wait for kube-apiserver readyz after ServiceAccount key activation
      ansible.builtin.command: "{{ kubectl_command_effective }} --kubeconfig={{ kubeconfig_effective }} get --raw=/readyz"
      register: kube_apiserver_readyz_after_service_account_key_activation
      changed_when: false
      until: kube_apiserver_readyz_after_service_account_key_activation.rc == 0 and 'ok' in kube_apiserver_readyz_after_service_account_key_activation.stdout
      retries: 60
      delay: 5
      when: wait_static_pods_effective | bool

    - name: Wait for kube-apiserver pod on this node
      ansible.builtin.command: >-
        {{ kubectl_command_effective }} --kubeconfig={{ kubeconfig_effective }} -n kube-system wait
        --for=condition=Ready pod/kube-apiserver-{{ node_name.stdout }} --timeout=180s
      register: kube_apiserver_pod_ready_after_service_account_key_activation
      changed_when: false
      until: kube_apiserver_pod_ready_after_service_account_key_activation.rc == 0
      retries: 12
      delay: 5
      when: wait_static_pods_effective | bool

    - name: Wait for kube-controller-manager on this node
      ansible.builtin.command: >-
        {{ kubectl_command_effective }} --kubeconfig={{ kubeconfig_effective }} -n kube-system wait
        --for=condition=Ready pod/kube-controller-manager-{{ node_name.stdout }} --timeout=180s
      register: kube_controller_manager_ready_after_service_account_key_activation
      changed_when: false
      until: kube_controller_manager_ready_after_service_account_key_activation.rc == 0
      retries: 12
      delay: 5
      when: wait_static_pods_effective | bool
